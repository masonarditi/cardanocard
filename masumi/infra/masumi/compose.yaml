# Baseline from masumi-network/masumi-services-dev-quickstart.
# Validate the service API/contract against our SDK before setting MASUMI_V1_COMPATIBLE.
name: cardano-card-masumi
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: masumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare_masumi.py first}
      POSTGRES_DB: masumi_payment
    volumes:
      - payment_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U masumi -d masumi_payment"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  payment:
    image: ghcr.io/masumi-network/masumi-payment-service:0.22.0
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://masumi:${POSTGRES_PASSWORD}@postgres:5432/masumi_payment?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run scripts/prepare_masumi.py first}
      ADMIN_KEY: ${ADMIN_KEY:?Run scripts/prepare_masumi.py first}
      BLOCKFROST_API_KEY_PREPROD: ${BLOCKFROST_API_KEY_PREPROD:?Add a Blockfrost Preprod key to infra/masumi/.env}
      BLOCKFROST_API_KEY_MAINNET: ""
      PURCHASE_WALLET_PREPROD_MNEMONIC: ${PURCHASE_WALLET_PREPROD_MNEMONIC:-}
      SELLING_WALLET_PREPROD_MNEMONIC: ${SELLING_WALLET_PREPROD_MNEMONIC:-}
      COLLECTION_WALLET_PREPROD_ADDRESS: ${COLLECTION_WALLET_PREPROD_ADDRESS:-}
      SEED_ONLY_IF_EMPTY: "TRUE"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "npm run prisma:migrate && npm run prisma:seed && npm start"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 15
    restart: unless-stopped

volumes:
  payment_db:
